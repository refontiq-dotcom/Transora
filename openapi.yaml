openapi: 3.0.3
info:
  title: TRANSORA API
  version: 1.0.0
  description: >
    API pour l'infrastructure SaaS TRANSORA - Gestion d'entreprises de transport interurbain.
    Permet de planifier, vendre, encaisser, affecter, embarquer, transporter, contrôler et analyser.
  contact:
    name: Refontiq Team
    email: contact@refontiq-dotcom
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Serveur de développement local
  - url: https://api.transora.example.com/v1
    description: Serveur de production
tags:
  - name: auth
    description: Authentification et gestion des tenants
  - name: tenant
    description: Gestion des entreprises/tenants
  - name: voyage
    description: Départs, trajets et horaires
  - name: siege
    description: Inventaire et réservation des sièges
  - name: paiement
    description: Paiement des réservations et billetterie
  - name: dashboard
    description: Tableau de bord direction
  - name: flotte
    description: Gestion de la flotte automobile
  - name: personnel
    description: Gestion du personnel
  - name: incidents
    description: Signalement et suivi des incidents
  - name: notifications
    description: Notifications diverses
  - name: finance
    description: Opérations financières et rapports
  - name: recherche
    description: Recherche globale (billets, départs, véhicules)
  - name: embarquement
    description: Checkpoints d'embarquement et contrôle
  - name: audit
    description: Journal d'audit et événements critiques
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserTokenData"
        message:
          type: string
    UserTokenData:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
        tenantId:
          type: string
    Periode:
      type: object
      properties:
        debut:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
    Pagination:
      type: object
      properties:
        page:
          type: integer
          default: 1
        limit:
          type: integer
          default: 20
        total:
          type: integer
paths:
  /health:
    get:
      summary: Health check
      responses:
        200:
          description: OK
  /api/v1/auth/login:
    post:
      summary: Connexion
      responses:
        200:
          description: Connecté
  /api/v1/audit/evenement:
    post:
      summary: Enregistrer événement
      security: [bearerAuth]
      responses:
        201:
          description: Enregistré
  /api/v1/tenant:
    get:
      summary: List tenants
      responses:
        200:
          description: List
  /api/v1/voyage/departures:
    get:
      summary: List departures
      responses:
        200:
          description: List
  /api/v1/sieges/reserver:
    post:
      summary: Reserve seat
      security: [bearerAuth]
      responses:
        201:
          description: Reserved
  /api/v1/paiements:
    get:
      summary: List payments
      responses:
        200:
          description: List
  /api/v1/dashboard:
    get:
      summary: Dashboard
      responses:
        200:
          description: Metrics