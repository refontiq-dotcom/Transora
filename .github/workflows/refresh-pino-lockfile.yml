name: Refresh dependency lockfile

on:
  push:
    branches: [fix/pino-logging]

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pino-logging
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "chore(deps): update lockfile for Pino"
            git push origin fix/pino-logging
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Verify TypeScript build
        run: npm run build
