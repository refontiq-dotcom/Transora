name: Validate Pino logging changes

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/lib/logger.ts"
      - "src/app.ts"

permissions:
  contents: read

jobs:
  validate-pino:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pino-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript build
        run: npm run build
